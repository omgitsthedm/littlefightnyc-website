quality_charter:
  source: "/Users/davidmarsh/Code/LiFi NYC/agency-ops/quality/QUALITY-CHARTER.md"
  version: null
  owner: null
  status: "ABSENT_VERIFIED_2026-07-24"
  note: "The central charter does not exist at the required path. No version or policy owner is inferred."

surface: service-enabled
risk_tier: moderate
risk_rationale: >-
  The public site collects contact details through Netlify Forms. The Website
  Audit Lab also accepts a public URL and email, starts background work, stores
  report/status/engagement data in Netlify Blobs, and can send results to
  external providers. There are no user accounts, payments, or multi-tenant
  authenticated application roles.
hybrid_surfaces:
  - path: "/examples/audit/"
    class: "service-enabled"
    note: "Public audit intake with background processing, AI assistance, persistent report state, email delivery, and optional CRM/alert delivery."
  - path: "/examples/lab/"
    class: "marketing-showcase"
    note: "Static experimental showroom; source and repository controls are prohibited."
  - path: "/brand-kit/"
    class: "internal-static"
    note: "Unlisted internal brand reference and downloadable asset package."

owner: "David Marsh"
backup_owner: null
