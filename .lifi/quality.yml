    source: "app/public/sw.js"
    registration: "app/public/register-sw.js"
    behavior: "network-first public navigation; stale-while-revalidate public static assets; Dakota /app routes, dakota.html, APIs, and Identity endpoints bypass interception; passive activation after controlled tabs close"

jobs:
  - name: "Dakota daily research and signed publish"
    trigger: "external local scheduler outside this website and Netlify deploy"
    work: "bounded public-source prospect research, validation, and signed publication of at most ten records to the canonical Dakota endpoint"
    boundary: "No automatic outreach or upstream mutation; local runtime state and credentials remain outside the website repository."
  - name: "Website Audit background pipeline"
    trigger: "one-time-token call from run-audit"
    work: "PageSpeed, site scrape, optional Anthropic through Netlify AI Gateway, HTML generation, Blob writes, Netlify Database lead upsert, Gmail API delivery"
    retry_reconciliation: "partial best-effort provider handling exists; end-to-end delivery monitor remains open"
  - name: "expired Audit cleanup"
    trigger: "0 3 * * *"
    work: "delete expired 30-day report pages, metadata, views, status, and orphaned job tokens; delete 12-month Audit lead records"
  - name: "scheduled quality maintenance"
    trigger: null
    work: "not implemented"

