schema_version: 1
manifest_id: "littlefightnyc-website"
updated_at: "2026-08-03"

quality_charter:
  source: "/Users/davidmarsh/Code/LiFi NYC/agency-ops/quality/QUALITY-CHARTER.md"
  version: null
  owner: null
  status: "ABSENT_VERIFIED_2026-08-01"
  note: "The central charter does not exist at the required path. No version or policy owner is inferred."

surface: service-enabled
risk_tier: moderate
risk_rationale: >-
  The public site collects contact details through Netlify Forms. The Website
  Audit Lab also accepts a public URL and email, starts background work, stores
  report/status/engagement data in Netlify Blobs, and can send results to
  external providers. Dakota adds one exact-account authenticated operator
  surface with a private public-source queue and bounded operator state. There
  are no payments or multi-tenant roles; Dakota's server boundary requires both
  hello@littlefightnyc.com and dakota_operator on every private read or write.
hybrid_surfaces:
  - path: "/app/"
    class: "authenticated-private"
    note: "Dakota single-operator research desk; noindex/no-store shell, exact Netlify Identity email and role, private Blob queue and operator state, and no automatic outreach."
  - path: "/examples/audit/"
    class: "service-enabled"
    note: "Public audit intake with background processing, AI assistance, Blob report state, Netlify Database follow-up, and Google Workspace email delivery."
  - path: "/examples/lab/"
    class: "marketing-showcase"
    note: "Static experimental showroom; source and repository controls are prohibited."
  - path: "/brand-kit/"
    class: "internal-static"
    note: "Unlisted internal brand reference and downloadable asset package."

