asset_budgets:
  entry_javascript_raw_bytes_max: 375000
  entry_css_raw_bytes_max: 135000
  largest_lazy_route_javascript_raw_bytes_max: 165000
  first_party_fonts_total_raw_bytes_max: 130000
  standard_responsive_image_raw_bytes_max: 450000
  lab_showcase_thumbnail_raw_bytes_max: 120000
  social_share_card_raw_bytes_max: 600000
  route_catalog_count_min: 200
  generated_html_count_min: 220
budget_baseline:
  source: ".lifi/evidence/baselines/2026-07-24.md"
  enforcement: "Manifest and release-artifact checks are implemented; numeric asset, visual, and field-performance enforcement remains incomplete."

monitors:
  - name: "consent-gated RUM"
    coverage: "Core Web Vitals and sanitized client errors"
    status: "implemented; provider/account review external"
  - name: "Netlify Lighthouse build plugin"
    coverage: "build-time Lighthouse"
    status: "configured; thresholds and retained evidence not proven in repository"
  - name: "monthly Tech Audit form delivery test"
    coverage: "browser -> Netlify Forms -> inbox"
    status: "documented manual procedure; current completion evidence missing"
  - name: "Website Audit status and expiration"
    coverage: "Blob-backed job state and daily cleanup logs"
    status: "implemented; alert ownership not documented"
  - name: "external route, asset, metadata, and revision synthetic"
    coverage: "production"
    status: "implemented under quality:live; revision-matched production run passed for release d02b935"
  - name: "social preview platform validation"
    coverage: "Meta, LinkedIn, and X"
    status: "missing external verification"

maintenance_tier: "CONDITIONAL — owner exists; backup owner, funded SLA, cadence, and alert ownership are unresolved"
