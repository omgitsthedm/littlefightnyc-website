      - "app/public/_redirects maps public.json, archive.json, and meta.json to the sanitized cloud publication with forced 200 rewrites."
      - "netlify.toml no longer grants a browser connection to vera-pipeline or raw.githubusercontent.com."
      - "app/scripts/audit-vera-csp.mjs rejects external browser feed origins and verifies all three same-origin rewrites."
