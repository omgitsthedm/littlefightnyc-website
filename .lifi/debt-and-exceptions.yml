    mitigation:
      - "Keep browser data requests first-party under /vera/data/*."
      - "Keep the public lens and privacy audit in the engine's cloud publication workflow."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "FEEDS contains exactly one same-origin public.json entry."
      - "audit-vera-csp passes with no vera-pipeline reference in public runtime/configuration."

  - id: "VERA-FEED-001"
    type: "upstream-data"
    status: "open"
    risk: "low"
    finding: "The VERA Pipeline view shows three permanently empty columns and a source count that contradicts itself, because the feed does not carry the fields the view was built for."
    evidence:
      - "public.json `sources` entries carry only {source_name, status, enabled} — e.g. {\"source_name\": \"craigslist\", \"status\": \"ok\", \"enabled\": true}. No tier, reliability or last_success."
      - "So Tier, Reliability and Last success render an em dash on all 10 rows: three of five columns are a wall of dashes."
      - "`source_health` reports {active: 11, healthy: 11, partial: 0, broken: 0} while `sources` has 10 entries. The sidebar therefore says \"sources 11/11 healthy\" beside a table headed \"10 registered\"."
    impact: "The Pipeline view is the page that argues VERA is a real system rather than a scraper. Three empty columns and two disagreeing counts undercut exactly that. Nothing is broken in the site code — the view renders what it is given."
    mitigation:
      - "Fix upstream in ~/Code/Personal/vera-apartment-search (github.com/omgitsthedm/vera-apartment-search): emit tier, reliability and last_success per source, and reconcile source_health.active with the length of sources."
      - "Or, if those fields are not going to exist, drop the three columns from renderPipeline in app/public/vera/assets/js/vera.js and derive the health counts from the sources array so the two cannot disagree."
      - "Not decided here because it is a question about what the pipeline should publish, and the fix belongs in the other repository either way."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "The Pipeline sources table shows real values in Tier, Reliability and Last success."
      - "The sidebar source count and the table count agree."

  - id: "FONTS-001"
    type: "third-party-request"
    status: "open"
    risk: "low"
    finding: "Eight Lab concept pages still fetch a Google Fonts stylesheet, handing Google every visitor's IP and User-Agent before any consent interaction. Unlike the audit reports, these genuinely need it."
    evidence:
      - "All eight request Barlow Condensed: e.g. aha-laser asks for family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600."
      - "Barlow Condensed is load-bearing — all eight concept stylesheets use it (laser.css, goliath.css, feel.css, pill.css, street.css, walkup.css, district.css, engine.css) — and unlike Barlow, Oswald and JetBrains Mono it is not self-hosted: absent from package.json and from public/assets/fonts/."
      - "growth-street and studio-engine additionally render Fraunces; measured as status \"loaded\" and present in their computed font-family."
      - "By contrast the five sample audit reports listed both Libre Baskerville and Lato as \"unloaded\" and used neither, so removing their link changed 0 of 1,152,000 pixels. Those are done."
    impact: "Every visitor to a Lab concept page is disclosed to Google before opting in, on a site that otherwise makes zero third-party requests until consent. Eight pages, all linked from the Lab hub."
    mitigation:
      - "Self-host the two missing families the way the others already are: npm i @fontsource/barlow-condensed @fontsource-variable/fraunces, copy the woff2 into app/public/assets/fonts/, add @font-face blocks alongside the existing ones in app/public/assets/lf-fonts.css, then drop the three Google link tags from each of the eight pages."
      - "Verify per page that computed font-family still resolves to Barlow Condensed (and Fraunces on growth-street and studio-engine) — a silent fallback to Arial would be a worse outcome than the leak."
      - "Not done here because it adds two dependencies and touches the typography of eight builds David has iterated on repeatedly. Removing the link without self-hosting first would regress them."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "No Lab concept page requests fonts.googleapis.com or fonts.gstatic.com."
      - "Each page still computes Barlow Condensed, and Fraunces where it did before."
      - "THIRD_PARTY_FONT_EXEMPT in app/scripts/audit-site-integrity.mjs is empty."

  - id: "DEMO-001"
    type: "stale-content"
    status: "open"
    risk: "low"
    finding: "The Mike Ziemer demo links twice to https://www.flipaswitchstudios.com, which returns 404. The sibling brand flipaswitchcreative.com returns 200, so the domain has probably been renamed or retired."
    evidence:
      - "curl -o /dev/null -w '%{http_code}' -L https://www.flipaswitchstudios.com -> 404"
      - "Two occurrences in app/public/myspace-demo/index.html: one social icon with aria-label \"Flip A Switch Studios\", one inline text link."
      - "Every other outbound link on the page resolves 200: facebook.com/mikeziemer, instagram.com/mikeziemer, tiktok.com/@mikeziemer, mikeziemer.com, flipaswitchmusic.com, www.flipaswitchcreative.com."
