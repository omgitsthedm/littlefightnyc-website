  - id: "SEO-001"
    type: "information-architecture"
    status: "open"
    risk: "moderate"
    finding: "The intended long-term route-fanout policy is unresolved for a 200-route catalog containing 91 area-related routes and 73 noindex routes."
    evidence:
      - "Generated route-meta.json baseline: 200 total routes."
      - "Area distribution: 91 routes; total noindex distribution: 73 routes."
    impact: "Large low-value or overlapping route families can dilute maintenance attention, confuse navigation, or create future indexation risk if policy changes accidentally."
    mitigation:
      - "Decide which route families serve distinct owner intent and which should consolidate, redirect, remain noindex, or retire."
      - "Measure search performance and content uniqueness before changing index policy."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "Approved route-class decision matrix with user intent, index policy, canonical/redirect behavior, and owner."
      - "Sitemap, metadata, internal-link, crawl, and live-route evidence match the decision."

  - id: "DEP-001"
    type: "dependency-security"
    status: "open"
    risk: "high"
    finding: "react-router is within the reported affected range for GHSA-qwww-vcr4-c8h2 (>=7.12.0 <8.3.0)."
    evidence:
      - "The application currently uses react-router-dom 7.15 in a client-side SPA."
      - "Repository review did not find React Server Components mode or affected server actions in use, so the vulnerable path appears unlikely to be reachable; this is a bounded assessment, not a dismissal."
    impact: "If RSC mode or affected actions are introduced or already reachable through an unrecognized path, crafted input could exercise the advisory."
    mitigation:
      - "Confirm the affected feature conditions against the primary advisory and the app route/runtime architecture."
      - "Track a tested compatible upgrade path outside the affected range."
      - "Do not force a downgrade or unreviewed major jump; re-check immediately if RSC or server actions are added."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "Dependency tree shows a non-affected compatible version."
      - "Clean install, build, browser journeys, prerender, and live checks pass."
      - "A dependency scan no longer reports GHSA-qwww-vcr4-c8h2."

  - id: "DEP-002"
    type: "dependency-security"
    status: "open"
    risk: "high"
    finding: "brace-expansion is reported through development/tooling transitive paths for GHSA-3jxr-9vmj-r5cp and GHSA-mh99-v99m-4gvg; fixes are available."
    evidence:
      - "The affected package is present in development/tooling dependency paths rather than an identified browser or Netlify Function runtime path."
      - "No package changes were made in this ledger-only baseline."
    impact: "Malicious or unexpectedly complex patterns processed by affected tooling could create denial-of-service or resource-exhaustion exposure in developer or CI contexts."
    mitigation:
      - "Resolve the exact dependency paths and apply the smallest clean compatible remediation."
      - "Re-run clean install, dependency audit, build, lint, generation, and quality tiers."
      - "Avoid blanket audit suppression or unrelated major upgrades."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "Lockfiles resolve only fixed brace-expansion versions on affected paths."
      - "A clean dependency scan no longer reports either advisory."
      - "Tooling, build, generation, and release checks pass without suppression."

  - id: "PROOF-002"
    type: "claim-substantiation"
    status: "open"
    risk: "moderate"
    finding: "The Legacy Music Group case publishes a 97 Lighthouse performance figure as evidence type \"outcome\", with no stored artifact and no externally reachable URL to re-measure against."
    evidence:
      - "app/src/data/site-cases.ts — slug legacy-music-group, stat value \"97\", label \"Fresh Lighthouse performance audit\", evidence: \"outcome\"."
      - "The same case states the external link is withheld until the approved build sits on a client-owned domain, so the figure cannot be independently reproduced from outside."
      - "The sibling CC Films claim was re-measured on 2026-07-29 and archived at .lifi/evidence/lighthouse/ccfilms-2026-07-29.md; no equivalent artifact exists for this one."
    impact: "A published performance number that cannot be produced on request is indistinguishable from an invented one if a prospect or the client asks for the source."
    mitigation:
      - "Run Lighthouse against the current release-candidate URL and archive the report under .lifi/evidence/lighthouse/."
      - "Publish the mobile figure rather than desktop, per Frontend Modernization Brief section 14."
      - "If the number cannot be reproduced, restate the claim in terms that the build evidence does support."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "A dated Lighthouse artifact exists for the Legacy Music Group build."
      - "The published figure matches that artifact and names its form factor."

  - id: "I18N-001"
    type: "scope"
    status: "open"
    risk: "low"
    finding: "The site serves three language surfaces (/, /es/, /zh/) but ships translation resources for one. Shared React chrome — including the analytics-consent panel — renders in English regardless of locale."
    evidence:
      - "app/src/i18n/locales/ contains only en/common.json; config.ts states plainly that it 'wires the CAPABILITY to translate — it does not translate anything yet' and that per-locale prerendering is phase-2 work, intentionally not set up."
      - "/es/ and /zh/ are hand-authored pages, not i18n-rendered; both serve correct <html lang> and localized titles, verified live 2026-07-29."
      - "The consent panel is opt-in, not a banner: SiteNotices.tsx only renders it on the CONSENT_OPEN_EVENT fired from the footer, so it 'never covers the site on first arrival'. Confirmed absent on a fresh /es/ visit."
    impact: "A Spanish or Chinese reader who deliberately opens Analytics choices gets an English panel. Limited blast radius, but it is the one place the language promise visibly breaks."
    mitigation:
      - "Do not translate single components piecemeal — a half-Spanish page reads worse than a consistent English one."
      - "When phase-2 i18n happens, add es/zh common.json bundles (import.meta.glob picks them up with no config change) and drive language from the URL prefix rather than the switcher alone."
      - "Translate the shared chrome as one unit: nav, CTAs, consent panel, footer."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "es and zh bundles exist and the shared chrome renders in the active locale."
      - "Language follows the URL prefix on /es/ and /zh/ without a manual switch."

  - id: "SOCIAL-002"
    type: "asset-quality"
    status: "open"
    risk: "moderate"
    finding: "125 of 205 indexed pages declare an og:image that is not close to the 1.91:1 ratio social platforms crop to for summary_large_image, and 19 of those are portrait or square."
    evidence:
      - "Measured from the built output 2026-07-29 once real dimensions were emitted: 1600x1200 (ratio 1.33) on 95 pages, 864x1184 (0.73, portrait) on 18, 2400x1600 (1.50) on 5, 2400x1603 on 2, 1440x1080 on 1, 1068x1800 (0.59, portrait) on 1."
      - "Only 33 pages use a purpose-built 1200x630 card from /assets/social/."
      - "The answers art (/assets/answers-*.webp) is editorial 4:3 artwork being reused as a share card."
      - "WebP og:image support is uneven across platforms; the purpose-built cards are JPEG."
    impact: "A portrait or 4:3 image in a 1.91:1 slot is centre-cropped, so the composition a reader sees in a share preview is not the one that was designed. On platforms that reject WebP the preview falls back to no image at all."
    mitigation:
      - "scripts/generate-social-cards.mjs already renders 1200x630 JPEG cards headlessly — extend its card list to the answers, journal, and area families rather than hand-cutting images."
      - "Keep the editorial artwork for on-page use; the share card is a separate artifact."
      - "Dimensions are now read from the file at build, so once the images change the tags follow automatically."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "Every indexed page's og:image is within tolerance of 1.91:1."
      - "No portrait or square image is used as a share card."

  - id: "DEAD-002"
    type: "dead-code"
    status: "open"
    risk: "low"
    finding: "TechAudit.tsx carries a three-step symptom quiz that cannot be reached. Roughly 160 lines of JSX and handlers, plus two analytics events that can never fire."
    evidence:
      - "app/src/pages/TechAudit.tsx:204 initialises `useState<Step>(3)` with a literal, so the flow always opens on the form."
      - "Every call site of pickSymptom, pickUrgency and skipToForm (lines 459, 478, 486, 521, 546) sits inside the `step === 1` or `step === 2` JSX, which never renders."
      - "readDraft parses a saved `step` (line 144) but the state ignores it, so even a restored draft cannot enter step 1 or 2."
      - "intake_step_1 and intake_step_2 are therefore unreachable analytics events."
      - "Opening on the form is deliberate and documented at lines 202-203: owners describe the problem in their own words rather than completing a quiz first. That decision is correct under the Frontend Brief — friction wins."
    impact: "No runtime cost; React never evaluates the unreachable branches. The cost is comprehension — 160 lines of the primary conversion page describe a flow that does not exist — plus dead weight in the chunk and two analytics events that will never report."
    mitigation:
      - "Remove the step 1 and 2 blocks, pickSymptom, pickUrgency, skipToForm, the payoff state, hapticStep, STEP_TITLES[1] and [2], and the step state itself."
      - "Keep symptom and urgency: symptom is still set from the ?intent=website parameter and both feed hidden inputs at lines 588-589 and seed the message textarea."
      - "Do it as its own change set with the submit path verified end to end. This is the primary conversion form and a regression costs real leads, so it should not ride along with unrelated cleanup."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "TechAudit.tsx has no unreachable step branches."
      - "A live submission still delivers, and the hidden symptom/urgency inputs still carry their values."

  - id: "SOCIAL-003"
    type: "stale-asset"
    status: "open"
    risk: "low"
    finding: "og-websites.jpg no longer matches what its own generator produces, so re-running scripts/generate-social-cards.mjs silently rewrites a client-facing share card."
    evidence:
      - "The card is built from assets/case-hair-by-rachel-charles-900.webp (scripts/generate-social-cards.mjs, the og-websites entry)."
      - "That source has been replaced since the card was generated: it is now a multi-device composite, not the single full-bleed screenshot the committed card shows."
      - "Regenerating on 2026-07-29 produced a different image (85,595 -> 89,005 bytes) with the client name clipped mid-word: 'RACHEL CHARLES' renders as 'EL / ES'."
      - "No other card changed, so the drift is specific to this source image rather than to the renderer."
    impact: "None while nobody regenerates. The trap is that adding any new card re-runs the whole script, so an unrelated change quietly ships a worse card for the websites service page."
    mitigation:
      - "Either point the og-websites entry at a source that crops well at 700x630, or tune its position/size for the current composite."
      - "Then regenerate and confirm the client name is not clipped."
    owner: "David Marsh"
    review_by: null
    accepted_risk_expiry: null
    close_evidence:
      - "Running generate-social-cards.mjs leaves og-websites.jpg byte-identical."
      - "The rendered card shows the client name in full."

  - id: "VERA-CORS-001"
    type: "dead-redundancy"
