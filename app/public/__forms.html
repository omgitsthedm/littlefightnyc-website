<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Internal Netlify form detector | Little Fight NYC</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Internal build-time form detector. Not a public page." />
  </head>
  <body data-internal-form-detector="true">
    <form name="tech-audit-scratch" method="POST" action="/thanks/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="tech-audit-scratch" />
      <input type="hidden" name="subject" value="New Little Fight NYC Tech Audit" />
      <input type="hidden" name="source" value="littlefightnyc.com/tech-audit" />
      <input name="bot-field" />
      <input name="name" />
      <input name="business" />
      <input name="contact" />
      <select name="discovery_source">
        <option value="">Choose one</option>
        <option value="google">Google</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="other_ai">Another AI assistant</option>
        <option value="referral">A referral</option>
        <option value="social">Social media</option>
        <option value="other">Other</option>
        <option value="prefer_not_to_say">Prefer not to say</option>
      </select>
      <input name="symptom" />
      <input name="urgency" />
      <input name="intent" />
      <input name="lead_origin" />
      <input name="website_url" />
      <input name="report_id" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_term" />
      <input name="utm_content" />
      <input name="gclid" />
      <input name="gbraid" />
      <input name="wbraid" />
      <select name="follow_up">
        <option value="fastest">Whatever’s fastest</option>
        <option value="text">Text me</option>
        <option value="phone">Call me</option>
        <option value="email">Email me</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
