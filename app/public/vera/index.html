<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VERA — NYC rental intelligence</title>
  <meta name="description" content="VERA — Verified Evaluation for Rental Analysis. A live command center for one NYC apartment hunt: private-landlord-first discovery, public-record checks, scam flags, and scored best fits.">
  <meta name="theme-color" content="#0c0e0d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230c0e0d'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='9'%20fill='none'%20stroke='%23868c85'%20stroke-width='1.6'/%3E%3Cpath%20d='M16%2016%20L16%207%20A9%209%200%200%201%2023.8%2011.5%20Z'%20fill='%234cc38a'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='1.8'%20fill='%23e9ece8'/%3E%3C/svg%3E">
  <link rel="preload" href="./assets/fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/css/vera.css?v=1">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell" data-shell>
    <aside class="rail" data-rail>
      <a class="brand" href="#/command" aria-label="VERA — command">
        <svg class="insignia" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="ring" cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path class="sweep" d="M12 12 L12 2.75 A9.25 9.25 0 0 1 20.01 7.38 Z"/>
          <circle class="core" cx="12" cy="12" r="1.7"/>
        </svg>
        <span class="brand__name">VERA</span>
      </a>
      <p class="brand__tag">Verified Evaluation<br>for Rental Analysis</p>

      <nav class="rail__nav" aria-label="Sections" data-nav>
        <a href="#/command" data-route="command"><i class="nv nv--command"></i><span>Command</span></a>
        <a href="#/discover" data-route="discover"><i class="nv nv--discover"></i><span>Discover</span></a>
        <a href="#/pipeline" data-route="pipeline"><i class="nv nv--pipeline"></i><span>Pipeline</span></a>
        <a href="#/about" data-route="about"><i class="nv nv--about"></i><span>About</span></a>
      </nav>

      <div class="rail__foot">
        <p class="rail__status" data-rail-status>—</p>
        <p class="rail__credit">A Little Fight NYC system</p>
      </div>
    </aside>

    <div class="deck">
      <header class="topbar" data-topbar>
        <div class="topbar__snapshot">
          <span class="pulse" data-pulse aria-hidden="true"></span>
          <span data-snapshot-line>Loading snapshot…</span>
        </div>
        <div class="topbar__views" data-views role="group" aria-label="Saved views">
          <button type="button" data-view="fresh">Fresh tonight</button>
          <button type="button" data-view="owner">Owner-direct</button>
          <button type="button" data-view="clean">Clean buildings</button>
          <button type="button" data-view="verify">Needs verification</button>
          <button type="button" data-view="scam">Scam wall</button>
          <button type="button" data-view="all" class="is-on">Everything</button>
        </div>
      </header>

      <div class="filters" data-filters>
        <div class="filters__group" role="group" aria-label="Max rent">
          <span class="filters__label">Rent</span>
          <button type="button" data-rent="2000">≤$2,000</button>
          <button type="button" data-rent="2400">≤$2,400</button>
          <button type="button" data-rent="2800">≤$2,800</button>
          <button type="button" data-rent="3200">≤$3,200</button>
          <button type="button" data-rent="0" class="is-on">Any</button>
        </div>
        <div class="filters__group" role="group" aria-label="Unit type">
          <span class="filters__label">Unit</span>
          <button type="button" data-unit="studio">Studio</button>
          <button type="button" data-unit="1br">1BR</button>
          <button type="button" data-unit="all" class="is-on">Both</button>
        </div>
        <div class="filters__group filters__group--owner" role="group" aria-label="Ownership lens">
          <span class="filters__label">Owner</span>
          <button type="button" data-lens="noBrokers">No brokers</button>
          <button type="button" data-lens="noMgmt">No corporations</button>
          <button type="button" data-lens="privateFirst">Private first</button>
        </div>
        <div class="filters__group filters__group--hoods" data-hood-group role="group" aria-label="Neighborhoods">
          <span class="filters__label">Hoods</span>
          <div class="filters__hoods" data-hoods></div>
        </div>
        <button type="button" class="filters__clear" data-clear hidden>Clear ×</button>
      </div>

      <main id="main" class="main" data-main tabindex="-1">
        <section class="page page--command" data-page="command" hidden></section>
        <section class="page page--discover" data-page="discover" hidden></section>
        <section class="page page--pipeline" data-page="pipeline" hidden></section>
        <section class="page page--about" data-page="about" hidden></section>
        <div class="loading" data-loading>
          <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" class="loading__mark">
            <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
            <path d="M12 12 L12 2.75 A9.25 9.25 0 0 1 20.01 7.38 Z" fill="#4cc38a"/>
          </svg>
          <p>VERA is pulling the latest sweep…</p>
        </div>
      </main>
    </div>

    <aside class="inspector" data-inspector aria-label="Listing inspector" hidden>
      <div class="inspector__head">
        <div>
          <p class="inspector__kicker" data-insp-kicker></p>
          <h2 class="inspector__title" data-insp-title></h2>
          <p class="inspector__sub" data-insp-sub></p>
        </div>
        <button type="button" class="inspector__close" data-insp-close aria-label="Close inspector">×</button>
      </div>
      <div class="inspector__tabs" data-insp-tabs role="tablist">
        <button type="button" data-tab="overview" class="is-on" role="tab">Overview</button>
        <button type="button" data-tab="records" role="tab">Records</button>
        <button type="button" data-tab="owner" role="tab">Owner</button>
        <button type="button" data-tab="score" role="tab">Score</button>
        <button type="button" data-tab="verify" role="tab">Verify</button>
      </div>
      <div class="inspector__body" data-insp-body></div>
    </aside>
    <div class="scrim" data-scrim hidden></div>
  </div>

  <noscript><p class="fallback">VERA's console needs JavaScript — it renders a live data feed.</p></noscript>
  <script src="./assets/js/vera.js?v=1" defer></script>
</body>
</html>
