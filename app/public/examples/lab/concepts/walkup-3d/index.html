<!doctype html>
<html lang="en" class="lab-concept-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <title>Six-Story Walk-Up | The Lab · Little Fight NYC</title>
  <meta name="description" content="A cinematic New York block corner rendered live in the browser. One 3D asset that sells real estate, games, and film." />
  <link rel="icon" type="image/svg+xml" href="/examples/lab/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" />
  <link rel="stylesheet" href="walkup.css" />
</head>
<body>
  <canvas class="stage" data-scene aria-label="Cinematic three-dimensional model of a six-story New York walk-up at night, slowly rotating. Drag to spin it."></canvas>

  <header class="plate" data-plate>
    <p class="plate__eyebrow">The Lab · Build 01</p>
    <h1 class="plate__title">Six-Story<br />Walk-Up.</h1>
    <p class="plate__line">One living asset. Real estate&nbsp;· Games&nbsp;· Cinema.</p>
  </header>

  <p class="hint" data-hint>Drag to spin · pinch to lean in</p>

  <div class="veil" data-veil aria-hidden="true">
    <p class="veil__mark">SIX-STORY WALK-UP</p>
    <span class="veil__bar"><span class="veil__fill" data-veil-fill></span></span>
  </div>

  <noscript>
    <p class="fallback">This build needs JavaScript — it renders a live 3D New York walk-up.</p>
  </noscript>

  <script type="module" src="walkup.js"></script>
  <script defer src="/examples/lab/assets/lab-return.js"></script>
</body>
</html>
