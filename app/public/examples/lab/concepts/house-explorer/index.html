<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><meta name="theme-color" content="#f7f5ee"><meta name="color-scheme" content="light"><title>Farm House · Little Fight NYC</title>
<style>
*{box-sizing:border-box}:root{color-scheme:light;--paper:#faf8f2;--ink:#233d32;--muted:#526359;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);font-size:112.5%}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#6cbaeb;-webkit-font-smoothing:antialiased}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit;border:0}button:active,a.action:active{transform:scale(.96)}button,a.action{transition:transform .15s,background-color .18s,color .18s}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #246946;outline-offset:4px}button:disabled{cursor:wait;opacity:.6}
#scene{position:fixed;inset:0;height:100%;height:100dvh}#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.topbar{position:fixed;top:calc(16px + var(--safe-top));left:calc(16px + var(--safe-left));right:calc(16px + var(--safe-right));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}.brand{padding:10px 14px;background:var(--paper);box-shadow:0 4px 24px #142a2512;border-radius:18px;max-width:100%}.brand h1{font:500 1.4rem/1.12 Georgia,serif;letter-spacing:-.025em;margin:0 0 5px}.brand p{font-size:.83rem;line-height:1.35;margin:0;color:var(--muted)}.action{min-height:50px;display:inline-flex;justify-content:center;align-items:center;gap:7px;border-radius:15px;background:var(--paper);box-shadow:0 4px 24px #142a2512;padding:0 16px;text-decoration:none;font-size:.94rem;font-weight:600;color:var(--ink);pointer-events:auto;white-space:nowrap}.action svg{width:18px;height:18px}.top-actions{display:grid;justify-items:end;gap:8px;pointer-events:auto}.holiday-toggle{gap:10px;min-height:48px;font-size:.94rem}.holiday-toggle[aria-pressed=true]{background:#733345;color:#fff}.holiday-toggle span{font-size:.78rem;font-weight:600;opacity:.95}.holiday-toggle svg{width:18px;height:18px}
.view-footer{position:fixed;bottom:calc(14px + var(--safe-bottom));left:calc(14px + var(--safe-left));right:calc(14px + var(--safe-right));max-width:440px;margin:0 auto;display:grid;gap:10px;container-type:inline-size}.dock{border-radius:22px;padding:6px;background:var(--paper);box-shadow:0 5px 18px #10291e0e,0 18px 50px #10291e14}.lights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.lights button{border-radius:16px;background:transparent;min-height:66px;min-width:0;font-size:.94rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 3px;line-height:1.1}.lights button svg{width:23px;height:23px;stroke-width:1.65}.lights button[aria-pressed=true]{background:var(--ink);color:#fff}.below-dock{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:17px;background:var(--paper);padding:0 6px 0 14px;min-height:48px;box-shadow:0 4px 24px #142a2512}.hint{font-size:.83rem;line-height:1.35;margin:0;max-width:235px}.reset{background:transparent;min-height:48px;min-width:62px;padding:0 10px;font-size:.89rem;font-weight:600;border-radius:12px}
.loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:var(--paper);z-index:10}.loading h2{font:500 2rem Georgia,serif;margin:0 0 12px}.loading p{font-size:1rem;line-height:1.55;margin:0;color:var(--muted)}.loading a{display:inline-flex;min-height:50px;align-items:center;justify-content:center;color:var(--ink)}.loading img{max-width:100%}.loading[hidden],[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@container(max-width:18rem){.lights{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{max-width:70%}}
@media(min-width:700px){.topbar{top:calc(24px + var(--safe-top));left:calc(24px + var(--safe-left));right:calc(24px + var(--safe-right))}.brand{padding:14px 20px}.brand h1{font-size:1.7rem}.view-footer{bottom:calc(22px + var(--safe-bottom));max-width:460px}.lights button{min-height:70px;font-size:1rem}}
@media(max-width:350px){.topbar{gap:8px}.brand{padding:10px 12px}.brand h1{font-size:1.24rem}.action{padding:0 12px;font-size:.89rem}.hint{font-size:.78rem}.lights button{font-size:.89rem}}
@media(max-height:500px) and (min-width:600px){.topbar{top:calc(10px + var(--safe-top));left:calc(14px + var(--safe-left));right:calc(14px + var(--safe-right))}.brand{padding:9px 14px}.brand h1{font-size:1.3rem;margin-bottom:2px}.view-footer{bottom:calc(10px + var(--safe-bottom));max-width:450px;gap:6px}.lights button{min-height:48px;flex-direction:row;gap:6px;font-size:.89rem}.lights button svg{width:20px;height:20px}.dock{border-radius:19px;padding:4px}.lights button{border-radius:15px}.below-dock{min-height:48px}.reset{min-height:48px}}
@media(hover:hover){.action:hover,.reset:hover{background:#e8ece2}.holiday-toggle[aria-pressed=true]:hover{background:#63283a;color:#fff}.lights button:not([aria-pressed=true]):hover{background:#e8ece2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.collections{position:fixed;left:50%;top:calc(24px + var(--safe-top));transform:translateX(-50%);display:flex;gap:4px;background:var(--paper);border-radius:18px;padding:5px;box-shadow:0 4px 24px #142a2512;pointer-events:auto}
.collections button{min-height:46px;padding:0 19px;border-radius:13px;background:transparent;font-weight:600;font-size:.94rem}.collections button[aria-pressed=true]{background:var(--ink);color:white}
#construction-panel{position:fixed;inset:0;z-index:30;background:var(--paper)}#construction-panel iframe{width:100%;height:100%;border:0;display:block}
#view-select{min-width:0;max-width:55%;border:0;background:transparent;color:var(--ink);font:600 .86rem/1.2 -apple-system,BlinkMacSystemFont,sans-serif;height:48px;cursor:pointer;padding-right:5px}#gate-toggle{font-size:.81rem;white-space:nowrap;padding:0 8px}.below-dock{gap:2px;padding-left:10px}
@media(max-width:699px){.collections{top:calc(124px + var(--safe-top));padding:4px;white-space:nowrap}.collections button{min-height:44px;padding:0 20px}.brand p{font-size:.76rem}.top-actions{gap:6px}.action{min-height:44px}.holiday-toggle{min-height:44px}}
@media(max-height:500px) and (min-width:600px){.collections{top:calc(10px + var(--safe-top))}.collections button{min-height:44px;padding:0 12px}.top-actions .holiday-toggle{display:none}}

.view-footer>*{min-width:0}.below-dock #view-select{flex:1;width:0;max-width:none}.below-dock .reset{flex-shrink:0}#gate-toggle{min-width:0}
@media(max-width:699px){.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.brand{padding:10px;min-width:0}.brand h1{font-size:1.13rem;white-space:nowrap}.brand p{font-size:.64rem;white-space:nowrap}.top-actions .action{font-size:.75rem;padding:0 9px;min-height:44px}.top-actions .holiday-toggle{gap:5px}.holiday-toggle span{font-size:.66rem}.holiday-toggle svg{width:16px;height:16px}.collections{top:calc(116px + var(--safe-top));max-width:calc(100vw - 28px)}.collections button{padding:0 18px}.lights{grid-template-columns:repeat(4,minmax(0,1fr))}.lights button{min-height:60px;font-size:.82rem}.below-dock #view-select{font-size:.75rem}.below-dock #gate-toggle,.below-dock #reset{font-size:.74rem;padding:0 6px}.below-dock #reset{min-width:48px}}

html.lab-concept-page:not(.lab-concept-embed) .lab-concept-shell,html.lab-concept-page:not(.lab-concept-embed) .lab-concept-hint,html.lab-concept-page:not(.lab-concept-embed) .lab-concept-status{display:none!important}
html.lab-concept-embed #lab-return-link{display:none}
html.lab-concept-embed .topbar{right:calc(78px + var(--safe-right))}
html.lab-concept-embed body:is([data-collection="inside"],[data-collection="find"]) .lab-embed-exit{display:none}
/* The viewport here is the card's inner frame, which can be narrower than a phone. */
@media(max-width:480px){
  .topbar,html.lab-concept-embed .topbar{top:calc(12px + var(--safe-top));left:calc(12px + var(--safe-left));right:calc(64px + var(--safe-right));display:flex;flex-direction:column;gap:8px}
  .brand{padding:8px 12px;width:max-content;max-width:100%}
  .brand h1{font-size:20px;line-height:1.2;margin:0;white-space:normal}
  .brand p{display:none}
  .top-actions{display:flex;flex-wrap:wrap;justify-content:flex-start}
  .top-actions .holiday-toggle{font-size:14px;min-height:44px;padding:0 8px}
  .collections{top:calc(116px + var(--safe-top));left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));max-width:none;transform:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
  .collections button{min-width:0;min-height:44px;padding:0 2px;font-size:16px}
  .view-footer{left:calc(8px + var(--safe-left));right:calc(8px + var(--safe-right));bottom:calc(8px + var(--safe-bottom));gap:6px}
  .lights button{min-height:48px;padding:4px 2px;font-size:14px}
  .lights button svg{width:18px;height:18px}
  .below-dock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;gap:2px;min-height:0}
  .below-dock #view-select{grid-column:1/-1;width:100%;height:44px;font-size:15px;padding:0 8px}
  .below-dock #yard-toggle,.below-dock #gate-toggle,.below-dock #reset{min-width:0;min-height:44px;padding:0 2px;font-size:14px}
}
</style>
</head>
<body>
<main id="scene" aria-label="3D view of the house and property"></main>
<div id="property-controls"><header class="topbar"><div class="brand"><h1>Farm House</h1><p id="yard-description">Interactive property study of the house, barn, and grounds.</p></div><div class="top-actions"><a class="action" id="lab-return-link" href="/examples/lab/#showroom">The Lab</a><button class="action holiday-toggle" id="christmas-toggle" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 3 6h-2l5 6h-3l5 5H4l5-5H6l5-6H9l3-6Z M12 19v3"/></svg>Christmas <span id="christmas-state" aria-hidden="true">Off</span></button></div></header><nav class="collections" aria-label="Farm House sections"><button data-collection="property" aria-pressed="true">Property</button><button data-collection="inside" aria-pressed="false">Inside</button><button data-collection="find" aria-pressed="false">Find</button></nav>
<div class="view-footer"><nav class="dock lights" aria-label="Time of day">
<button data-lighting="dawn" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 17h20M4 21h16M7 17a5 5 0 0 1 10 0M12 4v4M4 10l3 3m13-3-3 3"/></svg>Dawn</button>
<button data-lighting="noon" aria-pressed="true" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg>Day</button>
<button data-lighting="dusk" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 17h20M4 21h16M7 17a5 5 0 0 1 10 0M4 10l3 3m13-3-3 3M12 2v7m-3-3 3 3 3-3"/></svg>Dusk</button>
<button data-lighting="night" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19.5 15A8 8 0 0 1 9 4.5 8 8 0 1 0 19.5 15ZM18 2v6m-3-3h6"/></svg>Night</button>
</nav><div class="below-dock"><label for="view-select" class="sr-only">View</label><select id="view-select" aria-label="View"><option value="aerial">Whole property</option><option value="west">West · Front</option><option value="east">East · Patio</option><option value="south">South</option><option value="north">North · Driveway</option><option value="plan">From above</option><option value="gates">Gate & entry</option><option value="porch">Front porch</option><option value="paths">Walkways</option><option value="barnEast">Barn</option></select><button class="reset" id="yard-toggle" aria-pressed="true" disabled>Garden</button><button class="reset" id="gate-toggle" aria-pressed="true" disabled>Gate open</button><button class="reset" id="reset" aria-label="Reset view" disabled>Reset</button></div></div>
</div><section id="construction-panel" hidden aria-label="Farm House Inside and Find"></section><div class="sr-only" id="status" role="status" aria-live="polite">Opening the house…</div>
<div class="loading" id="loading" role="status"><h2>Farm House</h2><p>Opening your view…</p></div>
<script defer src="./lab-bootstrap.js"></script><script defer src="/examples/lab/assets/lab-return.js"></script><script src="./farm-house-viewer.js?v=authentic-exterior-v2"></script><script src="./farm-house-adapter.js"></script>
<noscript><div class="loading"><h2>Farm House</h2><p>This interactive property study needs JavaScript enabled.</p></div></noscript>
</body>
</html>
