<!doctype html>
<html lang="en" class="lab-concept-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d0f3d" />
  <title>Neon District | The Lab · Little Fight NYC</title>
  <meta name="description" content="A living Tron-style business district: day cycles into neon night, traffic obeys the signals, and every glowing dot taps into a running simulation of the block." />
  <link rel="icon" type="image/svg+xml" href="/examples/lab/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="district.css?v=7" />
</head>
<body>
  <canvas class="stage" data-scene aria-label="A living neon 3D business district with day and night, traffic, and pedestrians. Drag to orbit, pinch to zoom, tap a glowing beacon to read its live numbers."></canvas>

  <header class="plate" data-plate>
    <p class="plate__eyebrow">The Lab · Build 02</p>
    <h1 class="plate__title">Neon<br />District.</h1>
    <p class="plate__line">A living city that remembers you. Tap beacons, citizens, even the cabs.</p>
  </header>

  <p class="hint" data-hint>Drag to orbit · pinch to zoom · tap a beacon</p>

  <aside class="chip" data-chip hidden>
    <span class="chip__bar" data-chip-bar></span>
    <div class="chip__head">
      <p class="chip__kicker" data-chip-kicker>Signal</p>
      <span class="chip__controls">
        <button class="chip__btn" data-chip-prev aria-label="Previous beacon">‹</button>
        <button class="chip__btn" data-chip-next aria-label="Next beacon">›</button>
        <button class="chip__btn chip__btn--close" data-chip-close aria-label="Close">×</button>
      </span>
    </div>
    <h2 class="chip__title" data-chip-title>—</h2>
    <p class="chip__body" data-chip-body>—</p>
    <dl class="chip__stats" data-chip-stats></dl>
  </aside>

  <div class="hud" data-hud hidden aria-hidden="true"></div>

  <p class="ticker" data-ticker aria-live="off"></p>

  <button class="audio" data-audio aria-pressed="false" aria-label="Toggle district sound">♪</button>

  <div class="veil" data-veil aria-hidden="true">
    <p class="veil__mark">NEON DISTRICT</p>
    <span class="veil__bar"><span class="veil__fill" data-veil-fill></span></span>
  </div>

  <noscript>
    <p class="fallback">This build needs JavaScript — it renders a living 3D neon district.</p>
  </noscript>

  <script type="module" src="main.js?v=2"></script>
  <script defer src="/examples/lab/assets/lab-return.js"></script>
</body>
</html>
