name: Repository guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  website-contracts:
    name: Website contracts and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install application dependencies
        run: npm ci --prefix app --ignore-scripts
      - name: Verify public function contracts
        run: npm run typecheck:functions
      - name: Run acquisition contracts
        run: npm run test:acquisition
      - name: Run repository guards and build the production artifact
        run: npm run build
