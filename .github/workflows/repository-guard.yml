name: Repository guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  retired-surfaces:
    name: Retired surfaces stay retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install guard dependencies
        run: npm ci --ignore-scripts
      - name: Check provider and repository boundaries
        run: |
          node app/scripts/audit-audit-integrations.mjs
          node app/scripts/audit-repo-boundary.mjs
          node app/scripts/audit-retired-integrations.mjs

  dakota-contracts:
    name: Dakota contracts and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install application dependencies
        run: npm ci --prefix app --ignore-scripts
      - name: Verify Dakota function contracts
        run: npm run typecheck:functions
      - name: Run the private-workspace test suite
        run: npm run test:dakota
      - name: Prove the unified production artifact builds
        run: npm run build
