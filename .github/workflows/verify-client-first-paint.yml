name: Verify final client first paint
on:
  push:
    branches: [case-studies/custom-domain-clients-2026-09-29]
    paths: [.github/workflows/verify-client-first-paint.yml]
permissions:
  contents: write
concurrency:
  group: client-final-first-paint
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-studies/custom-domain-clients-2026-09-29
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve styles after all component routes are registered
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/scripts/prerender-seo.mjs');s=p.read_text()
          start=s.index('const componentRouteStyles = Object.fromEntries(')
          end=s.index('// This renderer lives under node_modules',start)
          block=s[start:end];s=s[:start]+s[end:]
          marker='// Same treatment for the answers art map'
          assert marker in s;s=s.replace(marker,block+marker,1)
          needle='  const componentRoute = componentRenderedRoutes[page.path];\n  let html'
          assert needle in s
          s=s.replace(needle,'  const componentRoute = componentRenderedRoutes[page.path];\n  if (componentRoute && typeof componentRouteStyles[page.path] !== "string") {\n    throw new Error(`Missing first-paint stylesheet closure for ${page.path}`);\n  }\n  let html',1)
          p.write_text(s)
          p=Path('app/tests/client-case-studies.spec.ts');s=p.read_text()
          needle='    const html = await response.text();\n'
          assert needle in s
          s=s.replace(needle,needle+'    expect(html).not.toMatch(/>\\s*(?:undefined|null)\\s*</);\n    expect(html).toContain(`data-route-style="${path}"`);\n',1)
          needle='  await page.goto("/examples/");\n'
          assert needle in s
          s=s.replace(needle,'  const response = await page.goto("/examples/");\n  expect(await response!.text()).not.toMatch(/>\\s*(?:undefined|null)\\s*</);\n',1)
          p.write_text(s)
          Path('.github/workflows/verify-client-first-paint.yml').unlink()
          PY
      - run: npm ci && npm ci --prefix app && npm run build
      - name: Commit the exact corrected candidate
        id: commit
        run: |
          git config user.name 'Little Fight NYC'
          git config user.email '55168770+omgitsthedm@users.noreply.github.com'
          git add app/scripts/prerender-seo.mjs app/tests/client-case-studies.spec.ts app/src/data/route-meta.json app/src/data/nav-index.json .github/workflows/verify-client-first-paint.yml
          git diff --cached --check
          git commit -m 'Keep every client case fully styled on first paint'
          git push origin HEAD:refs/heads/case-studies/custom-domain-clients-2026-09-29
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release-gate:
    needs: correct
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.correct.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix app
      - working-directory: app
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run quality:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-client-release-test-results
          path: |
            app/test-results
            app/dist/release.json
          include-hidden-files: true
          retention-days: 7
  visual-review:
    needs: correct
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.correct.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix app && npm run build
      - working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Capture all client layouts from the corrected build
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          s=subprocess.check_output(['git','show','bb6f00f38785cc825aa5bcdf7af880ed493f5331:.github/workflows/prepare-client-release.yml'],text=True)
          start=s.index("          import {chromium} from '@playwright/test';")
          end=s.index('          JS\n',start)
          js=textwrap.dedent(s[start:end])
          Path('scripts/.client-visual-check.mjs').write_text(js)
          PY
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/client-preview.log 2>&1 &
          CANDIDATE_REVISION='${{ needs.correct.outputs.revision }}' node scripts/.client-visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-client-visual-review
          path: client-visual-review
          retention-days: 7
