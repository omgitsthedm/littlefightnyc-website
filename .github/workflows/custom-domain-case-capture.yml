name: Custom-domain case capture
on:
  push:
    branches: [case-studies/custom-domain-clients-2026-09-29]
    paths: [.github/workflows/custom-domain-case-capture.yml]
permissions:
  contents: write
concurrency:
  group: custom-domain-case-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/case-studies/custom-domain-clients-2026-09-29'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-studies/custom-domain-clients-2026-09-29
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix app
      - run: npx --prefix app playwright install --with-deps chromium
      - name: Capture public client sites read-only
        working-directory: app
        run: |
          cat > scripts/.client-captures.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          const evidence=resolve('../.lifi/evidence/cases/custom-domains-2026-09-29');
          await mkdir(evidence,{recursive:true});
          const sites=[
            ['hair-by-rachel-charles','https://hairbyrachelcharles.com/','Book'],
            ['cc-films','https://ccfilms.net/','Premiere Photos'],
            ['chromatic-painting-design','https://chromaticaz.com/','Services'],
            ['clearhelp','https://clearhelp.org/','How it works'],
            ['logan-loans','https://logan.loans/','Loan'],
            ['grand-funding-llc','https://www.grandfundingllc.com/','Loans'],
            ['the-break-room','https://thebreakroompoolhall.com/','Pool'],
            ['easy-tiger','https://easytigerglendale.com/','Menu'],
            ['the-tarot-hotline','https://thetarothotline.com/','Readings']
          ];
          const browser=await chromium.launch();
          const results=[];
          for (const [slug,url,detailLabel] of sites) {
            const out=resolve('public/assets/cases/2026-09-29',slug);
            await mkdir(out,{recursive:true});
            const record={slug,url,capturedAt:new Date().toISOString(),views:[],errors:[]};
            for (const [name,width,height,dpr] of [['desktop',1440,1000,2],['tablet',1024,1000,2],['mobile',390,844,2],['explore',1200,1000,1]]) {
              const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:dpr,reducedMotion:'reduce',serviceWorkers:'block',locale:'en-US'});
              await context.route('**/*',async route=>{
                const req=route.request();
                if(!['GET','HEAD'].includes(req.method())||/google-analytics|googletagmanager|clarity\.ms|facebook\.net|doubleclick/.test(req.url()))return route.abort();
                return route.continue();
              });
              const page=await context.newPage();
              try {
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                if(!response||response.status()!==200)throw new Error('HTTP '+response?.status());
                await page.evaluate(()=>document.fonts.ready);
                await page.waitForTimeout(2200);
                await page.evaluate(async()=>{for(let y=0;y<Math.min(document.documentElement.scrollHeight,6500);y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,80));}scrollTo(0,0);});
                await page.waitForTimeout(500);
                const detail=await page.evaluate(()=>({title:document.title,description:document.querySelector('meta[name="description"]')?.content,canonical:document.querySelector('link[rel="canonical"]')?.href,robots:document.querySelector('meta[name="robots"]')?.content,headings:[...document.querySelectorAll('h1,h2,h3')].map(h=>({text:h.textContent.trim(),y:Math.round(h.getBoundingClientRect().top+scrollY)})),links:[...document.querySelectorAll('a[href]')].map(a=>({text:a.textContent.trim().slice(0,160),href:a.href,rel:a.rel})),text:document.body.innerText.slice(0,28000),overflow:document.documentElement.scrollWidth>innerWidth+1,brokenImages:[...document.images].filter(i=>{const r=i.getBoundingClientRect();return r.top<innerHeight&&r.bottom>0&&r.width>0&&(!i.complete||i.naturalWidth===0)}).map(i=>i.currentSrc||i.src)}));
                if(name==='desktop')Object.assign(record,detail,{finalUrl:page.url(),status:response.status()});
                await page.screenshot({path:resolve(out,'home-'+name+'.png'),fullPage:name==='explore',animations:'disabled',caret:'hide'});
                record.views.push({name,width,height,dpr,overflow:detail.overflow,brokenImages:detail.brokenImages});
                if(name==='desktop') {
                  const candidate=detail.links.find(l=>{try{const u=new URL(l.href);return u.origin===new URL(page.url()).origin&&l.text.toLowerCase().includes(detailLabel.toLowerCase())&&u.href!==page.url()&&!/login|admin|sign-in/i.test(u.pathname);}catch{return false;}});
                  if(candidate){await page.goto(candidate.href,{waitUntil:'domcontentloaded',timeout:45000});await page.evaluate(()=>document.fonts.ready);await page.waitForTimeout(1500);}
                  else {const h=detail.headings.find(h=>h.y>650&&h.y<7000);await page.evaluate(y=>scrollTo(0,Math.max(0,y-130)),h?.y??800);await page.waitForTimeout(600);}
                  await page.screenshot({path:resolve(out,'detail-desktop.png'),animations:'disabled',caret:'hide'});
                  record.detail={url:page.url(),text:await page.locator('body').innerText(),scrollY:await page.evaluate(()=>scrollY)};
                }
              }catch(error){record.errors.push({view:name,message:String(error)});}
              finally{await context.close();}
            }
            results.push(record);
            await writeFile(resolve(evidence,slug+'.json'),JSON.stringify(record,null,2)+'\n');
          }
          await browser.close();
          await writeFile(resolve(evidence,'summary.json'),JSON.stringify(results.map(({slug,url,finalUrl,status,title,errors,views})=>({slug,url,finalUrl,status,title,errors,views})),null,2)+'\n');
          if(results.some(r=>r.errors.length))process.exitCode=1;
          JS
          node scripts/.client-captures.mjs
          rm scripts/.client-captures.mjs
      - name: Encode faithful captures and create inspection sheets
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/images"
          "$RUNNER_TEMP/images/bin/pip" -q install Pillow==11.3.0
          "$RUNNER_TEMP/images/bin/python" - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import json,hashlib
          root=Path('app/public/assets/cases/2026-09-29'); evidence=Path('.lifi/evidence/cases/custom-domains-2026-09-29')
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',20)
          manifest=[]
          for folder in sorted(root.iterdir()):
            if not folder.is_dir():continue
            sheet=Image.new('RGB',(1600,1400),'#111216');d=ImageDraw.Draw(sheet)
            for i,name in enumerate(['home-desktop','home-tablet','home-mobile','detail-desktop']):
              p=folder/(name+'.png')
              if not p.exists():continue
              im=Image.open(p).convert('RGB');im.thumbnail((736,600),Image.Resampling.LANCZOS)
              x=32+(i%2)*800;y=32+(i//2)*700;d.text((x,y),folder.name+' / '+name,font=font,fill='white');sheet.paste(im,(x+(736-im.width)//2,y+40))
            sheet.save(evidence/(folder.name+'-sheet.jpg'),quality=90)
            for p in folder.glob('*.png'):
              im=Image.open(p).convert('RGB')
              if p.stem=='home-explore':im=im.crop((0,0,im.width,min(2400,im.height)))
              dst=p.with_suffix('.webp');im.save(dst,'WEBP',quality=92,method=6)
              manifest.append({'file':str(dst),'width':im.width,'height':im.height,'bytes':dst.stat().st_size,'sha256':hashlib.sha256(dst.read_bytes()).hexdigest()});p.unlink()
          (evidence/'image-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Retain evidence on candidate branch
        if: always()
        run: |
          test "$GITHUB_REF" = 'refs/heads/case-studies/custom-domain-clients-2026-09-29'
          git config user.name 'Little Fight case review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/assets/cases/2026-09-29 .lifi/evidence/cases/custom-domains-2026-09-29
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Record current custom-domain client captures [skip netlify]'
          git push origin HEAD:refs/heads/case-studies/custom-domain-clients-2026-09-29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-domain-client-captures
          path: |
            app/public/assets/cases/2026-09-29
            .lifi/evidence/cases/custom-domains-2026-09-29
