name: Verify published client cases
on:
  push:
    branches: [case-studies/custom-domain-clients-2026-09-29]
    paths: [.github/workflows/verify-published-cases-20260929.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56df5e9befc6650571383a83de1a45df59cee787
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact live revision and existing read-only contract
        env:
          EXPECTED_REVISION: 56df5e9befc6650571383a83de1a45df59cee787
        run: |
          set -o pipefail
          node app/scripts/verify-live.mjs 2>&1 | tee /tmp/lifi-live-contract.log
      - name: Install browser tools
        run: npm ci --prefix app && cd app && npx playwright install --with-deps chromium
      - name: Inspect nine published pages at three widths
        working-directory: app
        run: |
          mkdir -p /tmp/lifi-published-cases
          cat > scripts/.verify-published-cases.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import {writeFile} from 'node:fs/promises';
          const origin='https://littlefightnyc.com';
          const release=await(await fetch(origin+'/release.json?verify='+Date.now())).json();
          if(release.revision!=='56df5e9befc6650571383a83de1a45df59cee787')throw new Error('Wrong live revision');
          const clients={
            'hair-by-rachel-charles':'hairbyrachelcharles.com',
            'cc-films':'ccfilms.net',
            'chromatic-painting-design':'chromaticaz.com',
            'clearhelp':'clearhelp.org',
            'logan-loans':'logan.loans',
            'grand-funding-llc':'grandfundingllc.com',
            'the-break-room':'thebreakroompoolhall.com',
            'easy-tiger':'easytigerglendale.com',
            'the-tarot-hotline':'thetarothotline.com'
          };
          const browser=await chromium.launch();
          const results=[],failures=[],checked=new Map();
          async function asset(url){if(checked.has(url))return;const r=await fetch(url,{method:'HEAD',signal:AbortSignal.timeout(20000)});const v={url,status:r.status,type:r.headers.get('content-type')};checked.set(url,v);if(!r.ok||!v.type?.startsWith('image/'))failures.push('Image inaccessible: '+url);}
          const sitemap=await(await fetch(origin+'/sitemap.xml')).text();
          const examples=await(await fetch(origin+'/examples/')).text();
          for(const [slug,domain] of Object.entries(clients)){
            const url=origin+'/case-studies/'+slug+'/';
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)}),html=await r.text();
            if(r.status!==200)failures.push(slug+': HTTP '+r.status);
            if(!sitemap.includes(url))failures.push(slug+': absent from sitemap');
            if(!examples.includes('/case-studies/'+slug+'/'))failures.push(slug+': absent from examples links');
            if(!html.includes('lf-client-editorial')||!html.includes('data-client-case="'+slug+'"'))failures.push(slug+': first-response story absent');
            for(const [label,width,height] of [['desktop',1440,1000],['tablet',1024,1000],['phone',390,844]]){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce',serviceWorkers:'block'});
              await context.route('**/*',route=>{const q=route.request();return !['GET','HEAD'].includes(q.method())||/google-analytics|googletagmanager|clarity\.ms|facebook\.net|doubleclick/.test(q.url())?route.abort():route.continue();});
              const page=await context.newPage();
              try{
                await page.goto(url,{waitUntil:'networkidle',timeout:60000});await page.evaluate(()=>document.fonts.ready);
                await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,100));}scrollTo(0,0);});
                await page.waitForTimeout(700);
                const data=await page.evaluate(()=>({title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href,robots:document.querySelector('meta[name="robots"]')?.content,h1:[...document.querySelectorAll('h1')].map(h=>h.innerText),overflow:document.documentElement.scrollWidth>innerWidth+1,share:document.querySelector('meta[property="og:image"]')?.content,shareAlt:document.querySelector('meta[property="og:image:alt"]')?.content,description:document.querySelector('meta[name="description"]')?.content,images:[...document.images].filter(i=>i.getBoundingClientRect().width>0).map(i=>({src:i.currentSrc||i.src,alt:i.getAttribute('alt'),broken:!i.complete||i.naturalWidth===0})),links:[...document.querySelectorAll('a[href]')].map(a=>a.href),schema:[...document.querySelectorAll('script[type="application/ld+json"]')].map(s=>JSON.parse(s.textContent))}));
                results.push({slug,viewport:label,...data});
                if(data.canonical!==url||data.robots?.includes('noindex')||data.h1.length!==1||!data.description||!data.shareAlt||data.overflow)failures.push(slug+'/'+label+': metadata, heading or overflow');
                if(data.images.some(i=>i.broken||i.alt===null))failures.push(slug+'/'+label+': image loading or alt attribute');
                if(!data.links.some(l=>l.startsWith(origin+'/services/')))failures.push(slug+'/'+label+': service link absent');
                if(!data.links.some(l=>new URL(l).hostname.replace(/^www\./,'')===domain))failures.push(slug+'/'+label+': client link absent');
                if(!data.schema.length)failures.push(slug+'/'+label+': structured data absent');
                if(label==='desktop'){
                  if(data.share)await asset(data.share);else failures.push(slug+': share image absent');
                  for(const image of data.images)await asset(image.src);
                }
                await page.screenshot({path:'/tmp/lifi-published-cases/'+slug+'-'+label+'.jpg',quality:82,animations:'disabled'});
              }catch(e){failures.push(slug+'/'+label+': '+String(e));}
              finally{await context.close();}
            }
          }
          await browser.close();
          await writeFile('/tmp/lifi-published-cases/report.json',JSON.stringify({verifiedAt:new Date().toISOString(),release,caseCount:9,renderedViews:results.length,checkedImages:[...checked.values()],failures,results},null,2));
          console.log(JSON.stringify({release:release.revision,cases:9,views:results.length,images:checked.size,failures},null,2));
          if(failures.length)process.exitCode=1;
          JS
          set -o pipefail
          node scripts/.verify-published-cases.mjs 2>&1 | tee /tmp/lifi-published-cases/verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-case-verification
          path: |
            /tmp/lifi-live-contract.log
            /tmp/lifi-published-cases
          retention-days: 7
