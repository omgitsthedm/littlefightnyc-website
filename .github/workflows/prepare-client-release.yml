name: Prepare complete client case release
on:
  push:
    branches: [case-studies/custom-domain-clients-2026-09-29]
    paths: [.github/workflows/prepare-client-release.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: client-case-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-studies/custom-domain-clients-2026-09-29
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply the reviewed source patch
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,subprocess
          from pathlib import Path
          parts=sorted(Path('.lifi').glob('case-release-patch.[0-9][0-9]'))
          assert len(parts)==4
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest()=='00958329c9eef097bc823829dfe6ec900ec78f9cd1cf0bafffa08cb0059aabf3'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - run: npm ci && npm ci --prefix app
      - uses: actions/download-artifact@v4
        with:
          name: client-release-source-captures
          run-id: 36549495436
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/client-sources
      - name: Render complete framed evidence without altering the websites
        run: |
          python3 -m venv "$RUNNER_TEMP/client-images"
          "$RUNNER_TEMP/client-images/bin/pip" -q install Pillow==12.3.0 fonttools==4.63.0
          rm -rf app/public/assets/cases/2026-09-29 app/public/assets/cases/hair-by-rachel-charles
          "$RUNNER_TEMP/client-images/bin/python" app/scripts/prepare-client-case-images.py --captures "$RUNNER_TEMP/client-sources"
      - name: Remove only this task's temporary preparation files
        run: |
          rm .lifi/case-release-patch.00 .lifi/case-release-patch.01 .lifi/case-release-patch.02 .lifi/case-release-patch.03
          rm -f .github/workflows/rachel-case-capture.yml .github/workflows/rachel-case-workbench.yml .github/workflows/custom-domain-case-capture.yml .github/workflows/custom-domain-final-capture.yml .github/workflows/case-capture-corrections.yml .github/workflows/prepare-client-release.yml
      - name: Generate the exact public source records
        run: npm run build
      - name: Commit the isolated release candidate, not production
        id: commit
        run: |
          test "$(git branch --show-current)" = 'case-studies/custom-domain-clients-2026-09-29'
          git config user.name 'Little Fight NYC'
          git config user.email '55168770+omgitsthedm@users.noreply.github.com'
          git add app .lifi .github/workflows
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Rebuild nine live client case studies with framed evidence'
          git push origin HEAD:refs/heads/case-studies/custom-domain-clients-2026-09-29
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release-gate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix app
      - name: Install the supported verification browsers
        working-directory: app
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the complete production gate on the exact candidate
        run: npm run quality:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-case-release-test-results
          path: |
            app/test-results
            app/dist/release.json
          include-hidden-files: true
          retention-days: 7
  visual-review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix app && npm run build
      - working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Inspect every client at desktop, tablet, phone and narrow-phone widths
        working-directory: app
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/client-preview.log 2>&1 &
          cat > scripts/.client-visual-check.mjs <<'JS'
          import {chromium} from '@playwright/test';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          const cases=JSON.parse(await readFile('src/data/client-case-studies.json','utf8'));
          const out='../client-visual-review';await mkdir(out,{recursive:true});
          const browser=await chromium.launch();const reports=[];
          try {
            for(const width of [1440,1024,390,320]){
              const context=await browser.newContext({viewport:{width,height:1000},deviceScaleFactor:1,reducedMotion:'reduce',serviceWorkers:'block'});
              await context.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:4173')?r.continue():r.abort());
              for(const c of cases){
                const p=await context.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
                await p.goto(`http://127.0.0.1:4173/case-studies/${c.slug}/`,{waitUntil:'domcontentloaded'});
                await p.locator(`[data-client-case="${c.slug}"]`).waitFor();await p.evaluate(()=>document.fonts.ready);await p.waitForTimeout(800);
                if(width!==320)await p.screenshot({path:`${out}/${c.slug}-${width}-top.jpg`,type:'jpeg',quality:88,animations:'disabled'});
                await p.locator('.lf-client-editorial').scrollIntoViewIfNeeded();await p.evaluate(()=>scrollBy(0,-80));await p.waitForTimeout(250);
                if(width===1440)await p.screenshot({path:`${out}/${c.slug}-${width}-story.jpg`,type:'jpeg',quality:88,animations:'disabled'});
                await p.locator('.lf-client-capture--detail').scrollIntoViewIfNeeded();await p.waitForTimeout(500);
                if(width===390)await p.screenshot({path:`${out}/${c.slug}-${width}-detail.jpg`,type:'jpeg',quality:88,animations:'disabled'});
                const state=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,broken:[...document.querySelectorAll('.lf-client-capture img')].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src),h1:document.querySelector('h1').textContent,headlineOverflow:[...document.querySelectorAll('h1,h2,h3')].filter(i=>i.scrollWidth>i.clientWidth+2).map(i=>i.textContent)}));
                reports.push({slug:c.slug,width,errors,...state});await p.close();
              }
              await context.close();
            }
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:4173/examples/');await page.getByRole('heading',{name:'9 live sites. 9 real customer paths.'}).scrollIntoViewIfNeeded();await page.waitForTimeout(500);await page.screenshot({path:`${out}/examples-grid.jpg`,type:'jpeg',quality:90,animations:'disabled'});
          }finally{await browser.close();await writeFile(`${out}/report.json`,JSON.stringify({revision:process.env.CANDIDATE_REVISION,reports},null,2));}
          const failures=reports.filter(r=>r.errors.length||r.overflow||r.broken.length||r.headlineOverflow.length);
          console.log(JSON.stringify({checked:reports.length,failures},null,2));if(failures.length)process.exitCode=1;
          JS
          CANDIDATE_REVISION='${{ needs.prepare.outputs.revision }}' node scripts/.client-visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-case-visual-review
          path: client-visual-review
          retention-days: 7
