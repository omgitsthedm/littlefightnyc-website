name: Case editorial source review
on:
  push:
    branches: [case-studies/editorial-depth-2026-09-29]
    paths: [.github/workflows/editorial-depth-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source without repository credentials
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/editorial-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/editorial-revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-source
          path: |
            ${{ runner.temp }}/editorial-source.tar.gz
            ${{ runner.temp }}/editorial-revision.txt
          retention-days: 3
