name: Publish approved client case release
on:
  push:
    branches: [case-studies/custom-domain-clients-2026-09-29]
    paths: [.github/workflows/publish-client-case-release.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: little-fight-authorized-client-publication
  cancel-in-progress: false
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CANDIDATE_REVISION: 2f40e695d9b55ea0032f721fa7f7097fa3e06062
      EXPECTED_BASE: 64f80d6629f29a80750a2c8b0569c9dcbdd45dee
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f40e695d9b55ea0032f721fa7f7097fa3e06062
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require the complete release and visual gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const api='https://api.github.com/repos/omgitsthedm/littlefightnyc-website';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const end=Date.now()+45*60*1000;
          while(Date.now()<end){
            const r=await fetch(`${api}/actions/runs/36553563709`,{headers});if(!r.ok)throw Error(`Release gate API returned ${r.status}`);
            const run=await r.json();
            if(run.head_sha!=='4b079216b756aaffb47a843fe4ba1e4107ef7b45')throw Error('Wrong validation workflow revision');
            if(run.status==='completed'){
              if(run.conclusion!=='success')throw Error(`Release gate did not pass: ${run.conclusion}`);
              const jobs=await (await fetch(`${api}/actions/runs/36553563709/jobs`,{headers})).json();
              for(const name of ['finalize','release-gate','visual-review'])if(!jobs.jobs.some(j=>j.name===name&&j.conclusion==='success'))throw Error(`Missing passing ${name}`);
              console.log('Complete production gate and all 36 visual checks passed.');process.exit(0);
            }
            console.log(`Waiting for the exact candidate gate: ${run.status}`);await new Promise(r=>setTimeout(r,20000));
          }
          throw Error('The release gate did not complete in the bounded publication window.');
          JS
      - name: Fast-forward only the exact tested candidate to production
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
          test -z "$(git status --porcelain)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main..HEAD
          git push origin HEAD:refs/heads/main
      - name: Install existing live verification tools
        run: npm ci && npm ci --prefix app
      - name: Wait for Netlify's normal Git production deploy
        run: |
          node --input-type=module <<'JS'
          const end=Date.now()+12*60*1000;
          while(Date.now()<end){
            try{const r=await fetch('https://littlefightnyc.com/release.json',{headers:{'cache-control':'no-cache'}});const x=await r.json();if(x.revision===process.env.CANDIDATE_REVISION){console.log(JSON.stringify(x,null,2));process.exit(0);}console.log(`Current public revision: ${x.revision??'not ready'}`);}catch(e){console.log(String(e));}
            await new Promise(r=>setTimeout(r,10000));
          }
          throw Error('Netlify has not published the authorized revision. No manual deployment was attempted.');
          JS
      - name: Run the normal exact-revision live gate
        env:
          EXPECTED_REVISION: 2f40e695d9b55ea0032f721fa7f7097fa3e06062
        run: |
          set -o pipefail
          npm run quality:live 2>&1 | tee /tmp/client-case-live-gate.log
      - name: Verify every case, connection, and published image byte
        run: |
          mkdir -p /tmp/client-case-live-verification
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const site='https://littlefightnyc.com';
          const cases=JSON.parse(await readFile('app/src/data/client-case-studies.json','utf8'));
          const images=JSON.parse(await readFile('.lifi/evidence/cases/custom-domains-2026-09-29/rendered-image-manifest.json','utf8'));
          const report={revision:process.env.CANDIDATE_REVISION,verifiedAt:new Date().toISOString(),cases:[],images:[],errors:[]};
          const index=await fetch(site+'/examples/');const indexHtml=await index.text();
          const sitemap=await (await fetch(site+'/sitemap.xml')).text();
          function meta(html,key){return [...html.matchAll(/<meta\b[^>]*>/g)].map(m=>m[0]).find(t=>t.includes(`name="${key}"`)||t.includes(`property="${key}"`))?.match(/content="([^"]*)"/)?.[1];}
          for(const c of cases){
            const path=`/case-studies/${c.slug}/`;const r=await fetch(site+path);const html=await r.text();const errors=[];
            if(r.status!==200)errors.push(`HTTP ${r.status}`);
            if(!html.includes(`data-client-case="${c.slug}"`))errors.push('Current initial story missing');
            if(!html.includes(`rel="canonical" href="${site+path}"`))errors.push('Canonical mismatch');
            if(meta(html,'og:image')!==site+c.editorial.share.image)errors.push('Sharing image mismatch');
            if(!meta(html,'og:image:alt')||!meta(html,'twitter:image:alt'))errors.push('Image description missing');
            if(meta(html,'robots')?.includes('noindex'))errors.push('Unexpected noindex');
            if(/>\s*(?:undefined|null)\s*</.test(html))errors.push('Unexpected placeholder text');
            if(!html.includes(`href="${c.url}"`))errors.push('Client link missing');
            if(!indexHtml.includes(`href="${path}"`))errors.push('Results-page connection missing');
            if(!sitemap.includes(site+path))errors.push('Sitemap connection missing');
            report.cases.push({client:c.client,url:site+path,status:r.status,errors});
            report.errors.push(...errors.map(e=>`${c.slug}: ${e}`));
          }
          let next=0;
          await Promise.all(Array.from({length:6},async()=>{
            while(next<images.length){const image=images[next++];const url=site+'/'+image.path.replace(/^public\//,'');
              try{const r=await fetch(url);const bytes=Buffer.from(await r.arrayBuffer());const sha256=createHash('sha256').update(bytes).digest('hex');const ok=r.status===200&&sha256===image.sha256;report.images.push({url,status:r.status,bytes:bytes.length,sha256,ok});if(!ok)report.errors.push(`Image mismatch: ${url}`);}catch(e){report.errors.push(`${url}: ${e}`);}
            }
          }));
          await writeFile('/tmp/client-case-live-verification/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({revision:report.revision,cases:report.cases.length,images:report.images.length,errors:report.errors},null,2));
          if(report.errors.length)process.exitCode=1;
          JS
      - name: Install read-only live browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Inspect published desktop and phone layouts
        working-directory: app
        run: |
          cat > /tmp/client-live-browser.mjs <<'JS'
          import {createRequire} from 'node:module';
          import {readFile,writeFile} from 'node:fs/promises';
          const require=createRequire(process.cwd()+'/package.json');const {chromium}=require('@playwright/test');
          const cases=JSON.parse(await readFile('src/data/client-case-studies.json','utf8'));
          const browser=await chromium.launch();const reports=[];const errors=[];
          try{
            for(const width of [1440,390]){
              const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce',serviceWorkers:'block'});
              await context.route('**/*',route=>{
                const r=route.request();return ['GET','HEAD'].includes(r.method())&&new URL(r.url()).hostname==='littlefightnyc.com'?route.continue():route.abort();
              });
              for(const c of cases){
                const page=await context.newPage();const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
                const response=await page.goto(`https://littlefightnyc.com/case-studies/${c.slug}/`,{waitUntil:'domcontentloaded'});
                await page.locator(`[data-client-case="${c.slug}"]`).waitFor();await page.evaluate(()=>document.fonts.ready);await page.waitForTimeout(700);
                const state=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,heroLoaded:[...document.querySelectorAll('.lf-client-capture--hero img')].every(i=>i.complete&&i.naturalWidth>0),stray:[...document.body.childNodes].filter(n=>n.nodeType===3&&n.textContent.trim()).map(n=>n.textContent.trim())}));
                await page.screenshot({path:`/tmp/client-case-live-verification/${c.slug}-${width}.jpg`,type:'jpeg',quality:90,animations:'disabled'});
                await page.getByRole('button',{name:c.editorial.questions[0].question,exact:true}).click();
                if(response.status()!==200||pageErrors.length||state.overflow||!state.heroLoaded||state.stray.length)errors.push({slug:c.slug,width,status:response.status(),pageErrors,...state});
                reports.push({slug:c.slug,width,status:response.status(),pageErrors,...state});await page.close();
              }
              await context.close();
            }
          }finally{await browser.close();await writeFile('/tmp/client-case-live-verification/browser.json',JSON.stringify({reports,errors},null,2));}
          console.log(JSON.stringify({checked:reports.length,errors},null,2));if(errors.length)process.exitCode=1;
          JS
          node /tmp/client-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-client-case-verification
          path: |
            /tmp/client-case-live-gate.log
            /tmp/client-case-live-verification
          retention-days: 14
