name: Rachel case capture (review branch only)
on:
  push:
    branches: [case-study/rachel-charles-2026-09-29]
    paths: [.github/workflows/rachel-case-capture.yml]
permissions:
  contents: write
concurrency:
  group: rachel-case-capture-2026-09-29
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/case-study/rachel-charles-2026-09-29'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-study/rachel-charles-2026-09-29
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing app tools
        run: npm ci --prefix app
      - name: Install capture browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Capture public pages without submitting anything
        working-directory: app
        run: |
          cat > scripts/.rachel-capture-once.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          const out = resolve('public/assets/cases/hair-by-rachel-charles');
          const evidence = resolve('../.lifi/evidence/cases/hair-by-rachel-charles-2026-09-29');
          await mkdir(out, {recursive:true});
          await mkdir(evidence, {recursive:true});
          const browser = await chromium.launch();
          const records = [];
          const specs = [
            ['home-desktop', '/', 1440, 1000, null],
            ['home-tablet', '/', 1024, 1000, null],
            ['home-mobile', '/', 390, 844, null],
            ['hair-brief', '/', 1280, 900, 'What does your hair need?'],
            ['booking-desktop', '/booking/', 1440, 1000, null],
            ['booking-mobile', '/booking/', 390, 844, null],
            ['pricing-desktop', '/pricing/', 1440, 1000, null],
            ['gallery-desktop', '/gallery/', 1440, 1000, null]
          ];
          try {
            for (const [name, path, width, height, heading] of specs) {
              const context = await browser.newContext({viewport:{width,height}, deviceScaleFactor:2, reducedMotion:'reduce', locale:'en-US', serviceWorkers:'block'});
              await context.route('**/*', async route => {
                const request = route.request();
                const url = new URL(request.url());
                const tracker = /google-analytics|googletagmanager|clarity\.ms|facebook\.net|facebook\.com\/tr|doubleclick/.test(url.hostname + url.pathname);
                if (tracker || !['GET','HEAD'].includes(request.method())) return route.abort();
                return route.continue();
              });
              const page = await context.newPage();
              const response = await page.goto('https://hairbyrachelcharles.com' + path, {waitUntil:'networkidle',timeout:60000});
              if (!response || response.status() !== 200) throw new Error(`${name}: unexpected HTTP response`);
              await page.evaluate(() => document.fonts.ready);
              await page.waitForTimeout(1500);
              if (heading) {
                const target = page.getByRole('heading', {name:heading, exact:true});
                await target.scrollIntoViewIfNeeded();
                await page.evaluate(() => window.scrollBy(0,-140));
                await page.waitForTimeout(500);
              }
              const status = await page.evaluate(() => ({
                title:document.title,
                heading:document.querySelector('h1')?.textContent?.trim(),
                scrollY:window.scrollY,
                footerLinks:[...document.querySelectorAll('a[href*="littlefightnyc.com"]')].map(a=>({text:a.textContent.trim(),href:a.href,rel:a.rel})),
                visibleBrokenImages:[...document.images].filter(i=>{const r=i.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth&&r.width>0&&(!i.complete||i.naturalWidth===0)}).map(i=>i.currentSrc||i.src),
                overflow:document.documentElement.scrollWidth>innerWidth+1,
                fonts:document.fonts.status
              }));
              if (status.visibleBrokenImages.length || status.fonts !== 'loaded') throw new Error(`${name}: assets not ready ${JSON.stringify(status)}`);
              await page.screenshot({path:resolve(out,name+'.png'),fullPage:false,animations:'disabled',caret:'hide'});
              records.push({name,url:page.url(),capturedAt:new Date().toISOString(),viewport:{width,height},deviceScaleFactor:2,...status});
              await context.close();
            }
            await writeFile(resolve(evidence,'capture-report.json'), JSON.stringify({method:'Chromium viewport capture; reduced motion; GET/HEAD only; no booking, form, or account submissions; no page content altered.',records},null,2)+'\n');
          } finally { await browser.close(); }
          JS
          node scripts/.rachel-capture-once.mjs
          rm scripts/.rachel-capture-once.mjs
      - name: Produce optimized images and a review contact sheet
        run: |
          python3 -m venv "$RUNNER_TEMP/rachel-images"
          "$RUNNER_TEMP/rachel-images/bin/pip" -q install Pillow==11.3.0
          "$RUNNER_TEMP/rachel-images/bin/python" - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          import json, hashlib
          root=Path('app/public/assets/cases/hair-by-rachel-charles')
          evidence=Path('.lifi/evidence/cases/hair-by-rachel-charles-2026-09-29')
          assets=[]
          for path in sorted(root.glob('*.png')):
              im=Image.open(path).convert('RGB')
              webp=path.with_suffix('.webp')
              im.save(webp,'WEBP',quality=92,method=6)
              assets.append({'file':str(webp),'width':im.width,'height':im.height,'bytes':webp.stat().st_size,'sha256':hashlib.sha256(webp.read_bytes()).hexdigest()})
              path.unlink()
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          sheet=Image.new('RGB',(1440,1800),'#101114')
          draw=ImageDraw.Draw(sheet)
          for i,a in enumerate(assets):
              x=(i%2)*720+24;y=(i//2)*450+20
              draw.text((x,y),Path(a['file']).stem,font=font,fill='#ffffff')
              im=Image.open(a['file'])
              im.thumbnail((672,388),Image.Resampling.LANCZOS)
              sheet.paste(im,(x+(672-im.width)//2,y+36))
          sheet.save(evidence/'capture-contact-sheet.jpg',quality=90)
          (evidence/'image-manifest.json').write_text(json.dumps(assets,indent=2)+'\n')
          PY
      - name: Save capture evidence on this review branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/case-study/rachel-charles-2026-09-29'
          git config user.name 'Little Fight case review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/assets/cases/hair-by-rachel-charles .lifi/evidence/cases/hair-by-rachel-charles-2026-09-29
          git diff --cached --check
          git commit -m 'Capture Rachel public pages for case-study review [skip netlify]'
          git push origin HEAD:refs/heads/case-study/rachel-charles-2026-09-29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rachel-case-captures
          path: |
            app/public/assets/cases/hair-by-rachel-charles
            .lifi/evidence/cases/hair-by-rachel-charles-2026-09-29
