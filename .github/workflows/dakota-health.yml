name: Dakota public health

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dakota-public-health
  cancel-in-progress: true

jobs:
  public-entry:
    name: Verify the private app entry remains reachable
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Dakota without authenticating or mutating data
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --dump-header "$headers" --output "$body" \
            https://www.dakota.littlefightnyc.com/app/
          grep -Eqi '<title>[^<]*(Dakota|Little Fight)' "$body"
          grep -Eqi '^cache-control:.*(no-store|no-cache)' "$headers"
