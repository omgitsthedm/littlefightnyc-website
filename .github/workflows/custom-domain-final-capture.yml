name: Final client evidence captures
on:
  push:
    branches: [case-studies/custom-domain-clients-2026-09-29]
    paths: [.github/workflows/custom-domain-final-capture.yml]
permissions:
  contents: write
jobs:
  capture:
    if: github.ref == 'refs/heads/case-studies/custom-domain-clients-2026-09-29'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-studies/custom-domain-clients-2026-09-29
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix app && npx --prefix app playwright install --with-deps chromium
      - name: Prepare final public capture pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          t=Path('.github/workflows/custom-domain-case-capture.yml').read_text()
          js=textwrap.dedent(t[t.index('          import { chromium }'):t.index('          JS\n')])
          js=js.replace("['explore',1200,1000,1]", "['explore',1200,1000,1],['explore-tablet',1024,1000,1],['explore-mobile',390,844,1]")
          js=js.replace("fullPage:name==='explore'", "fullPage:name.startsWith('explore')")
          js=js.replace("await page.waitForTimeout(2200);", """await page.waitForTimeout(1200);
          const decline=page.getByRole('button',{name:/^(Decline|No thanks|Keep analytics off|Reject all|Reject optional.*)$/i}).first();
          if(await decline.isVisible().catch(()=>false)){await decline.click();await page.waitForTimeout(350);record.privacyChoice='Optional analytics declined through the normal public control.';}
          """)
          js=js.replace("const candidate=detail.links.find", "const preferred={'the-break-room':'/#play','chromatic-painting-design':'/painting/','clearhelp':'/need-help/','logan-loans':'/tools'};\nconst exact=preferred[slug]&&new URL(preferred[slug],page.url()).href;\nconst candidate=detail.links.find(l=>l.href===exact)||detail.links.find")
          js=js.replace("await page.waitForTimeout(1500);}", "await page.waitForTimeout(1000);const no=page.getByRole('button',{name:/^(Decline|No thanks|Keep analytics off|Reject all)$/i}).first();if(await no.isVisible().catch(()=>false))await no.click();}")
          js=js.replace("const results=[];", "const results=[];\n// Normal navigation only. No altered site text, fabricated UI, or submitted forms.")
          Path('app/scripts/.client-final-captures.mjs').write_text(js)
          py=textwrap.dedent(t[t.index('          from PIL import Image,ImageDraw,ImageFont'):t.index('          PY\n',t.index('          from PIL import Image,ImageDraw,ImageFont'))])
          py=py.replace("if p.stem=='home-explore':", "if p.stem.startswith('home-explore'):")
          Path('/tmp/client-encode.py').write_text(py)
          PY
      - name: Capture sites
        working-directory: app
        run: node scripts/.client-final-captures.mjs && rm scripts/.client-final-captures.mjs
      - name: Encode screenshots
        run: |
          python3 -m venv "$RUNNER_TEMP/images"
          "$RUNNER_TEMP/images/bin/pip" -q install Pillow==11.3.0
          "$RUNNER_TEMP/images/bin/python" /tmp/client-encode.py
      - name: Save exact source captures
        run: |
          git config user.name 'Little Fight case review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/assets/cases/2026-09-29 .lifi/evidence/cases/custom-domains-2026-09-29
          git diff --cached --check
          git commit -m 'Keep clean dated client screenshots and responsive evidence [skip netlify]'
          git push origin HEAD:refs/heads/case-studies/custom-domain-clients-2026-09-29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-domain-final-captures
          path: |
            app/public/assets/cases/2026-09-29
            .lifi/evidence/cases/custom-domains-2026-09-29
