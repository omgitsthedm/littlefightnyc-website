headersOrigin = "config"
redirectsOrigin = "config"

[functions]
directory = "netlify/functions"

[[plugins]]
origin = "ui"
package = "@netlify/plugin-lighthouse"
pinned_version = "6"

[build]
base = "."
# The handlers in netlify/functions are TypeScript that Netlify
# transpiles without typechecking, and the app build only covers app/src —
# so nothing on the deploy path ever checked them. A type error in a
# function shipped green. typecheck:functions runs from the repo root and
# needs app/node_modules, hence the order.
command = "cd app && npm ci && cd .. && npm run typecheck:functions && npm --prefix app run build"
publish = "app/dist"
publishOrigin = "config"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  # Speculation Rules via header (not inline <script>) — no CSP change needed.
  # Conservative: prefetch-on-hover of page HTML only; helps hard navigations
  # (new-tab/cmd-clicks, post-deploy reloads) — in-SPA navs are already instant.
  Speculation-Rules = '"/speculation-rules.json"'

[[headers]]
for = "/speculation-rules.json"

  [headers.values]
  Content-Type = "application/speculationrules+json"
  Cache-Control = "public, max-age=300"

# Dakota is a private operator surface inside this one Netlify project. The
# static shell contains no queue data, but it must never be cached, indexed,
# framed, or allowed to inherit the marketing site's analytics connections.
# VERA carries a real vector map (vendored MapLibre GL + keyless
# OpenFreeMap tiles). MapLibre renders in a blob: worker; tiles, glyphs,
# and sprites fetch from tiles.openfreemap.org. Everything else matches
# the site default.
[[headers]]
for = "/vera/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://tiles.openfreemap.org https://vera-pipeline.netlify.app; worker-src 'self' blob:; child-src blob:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
for = "/dakota.html"

  [headers.values]
  Cache-Control = "private, no-store, max-age=0"
  Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; worker-src 'none'"
  Cross-Origin-Embedder-Policy = "require-corp"
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Resource-Policy = "same-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
  Referrer-Policy = "no-referrer"
  Vary = "Cookie, Authorization"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
for = "/app/*"

  [headers.values]
  Cache-Control = "private, no-store, max-age=0"
  Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; worker-src 'none'"
  Cross-Origin-Embedder-Policy = "require-corp"
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Resource-Policy = "same-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
  Referrer-Policy = "no-referrer"
  Vary = "Cookie, Authorization"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Cinematic media filenames carry an eight-character content fingerprint.
# Cache the MP4 ladder and its poster/share stills permanently so the first
# visit pays for a file once and every repeated placement reuses it locally.
[[headers]]
for = "/media/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# /images/ had no rule at all, so it fell through to the SPA default and every
# file came back "max-age=0, must-revalidate" — including
# /images/brand-scenes/storefronts-dawn-1200.webp, which the home page
# <link rel="preload">s as its LCP candidate. Repeat visitors revalidated the
# one image that decides LCP on every single load.
#
# These filenames are not content-hashed, so "immutable" would be wrong: an
# updated photo could never reach anyone. A day of caching with a week of
# stale-while-revalidate keeps repeat loads instant and still lets a
# replacement propagate.
[[headers]]
for = "/images/*"

  [headers.values]
  Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The Brand Kit moved from brandkit.littlefightnyc.com to /brand-kit/.
# It is a preserved, self-contained static experience with inline motion and
# Google Fonts, so it needs its own narrow policy instead of the SPA policy.
[[headers]]
for = "/brand-kit/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"

[[headers]]
for = "/brand-kit/assets/*"

  [headers.values]
  # Brand assets are intentionally updated in place. Revalidate so an owner
  # never downloads a stale kit or sees an old lockup after a release.
  Cache-Control = "public, max-age=0, must-revalidate"

# The retired Lab subdomain is preserved as a static gallery under
# /examples/lab/. Its standalone concept pages use inline scripts, Google
# Fonts, and narrowly scoped module-CDN imports that the main app does not.
[[headers]]
for = "/examples/lab/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cdnjs.cloudflare.com https://unpkg.com https://esm.sh; media-src 'self' https:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
  X-Frame-Options = "SAMEORIGIN"

# A demo built around a named third party — the page title is their name and
# profession. The five client audit reports below already draw this boundary;
# this page was missed, so it was fully indexable and competing with that
# person's own site from a domain that is not theirs. It is shared by link, not
# found by search.
[[headers]]
for = "/myspace-demo/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"
[[headers]]
for = "/examples/lab/concepts/aha-laser/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

# Sample audit reports name real, identifiable third-party businesses and
# publish graded assessments of their websites — real domains, numeric scores,
# and "critical"/"warning" language. None of those businesses asked to be
# assessed in public under our brand. They stay reachable so the Audit Lab has
# something real to demonstrate, but they must not be search-discoverable
# against the practice's own name. Same boundary as /myspace-demo/ above.
#
# Neither sitemap lists them, so this closes the remaining route: a crawler
# following the one link from the Audit Lab index.
[[headers]]
for = "/examples/audit/ivy-infusions/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/examples/audit/marcus-medical/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/examples/audit/premier-plastic-surgery/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/examples/audit/skinsmart-dermatology/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/examples/audit/the-cosmetic-clinic/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

# The in-site Audit showroom and sample reports under /examples/audit/ use
# inline scripts plus Google Fonts, so they need a narrow policy instead of the
# main application's policy.
# /vera/ falls back to the pipeline origin directly when the _redirects proxy
# hop fails — that is the one failure the redundancy exists for. connect-src did
# not allow it, so the fallback was refused by CSP every time and the app had
# exactly one path to its data while appearing to have two. Verified in the
# browser: the fallback fetch threw "Refused to connect", the proxy returned 200.
#
# This repeats the site policy verbatim with one origin appended, because
# Netlify replaces headers per path rather than merging them. Keep it in step
# with the "/*" block above; audit-vera-csp asserts they only differ by that
# origin.
[[headers]]
for = "/vera/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://vera-pipeline.netlify.app https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"

[[headers]]
for = "/examples/audit/*"

  [headers.values]
  # font-src omitted 'self', so every self-hosted brand face on the Audit Lab
  # was refused and the section rendered in the OS UI font. Oswald, Barlow and
  # JetBrains Mono all reported status "error" in document.fonts, with six
  # blocked requests — invisible in review because a fallback still looks like
  # a page, on the one part of the site whose whole job is showing the work.
  # Every other font-src in this file already carries 'self' data:.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.googletagmanager.com https://www.google.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/examples/audit/report/*"

  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
for = "/examples/audit/api/og"

  [headers.values]
  Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/examples/audit/api/*"

  [headers.values]
  Access-Control-Allow-Headers = "Content-Type"
  Access-Control-Allow-Methods = "GET, POST, OPTIONS"
  Access-Control-Allow-Origin = "https://littlefightnyc.com"
  Access-Control-Max-Age = "86400"
  Cache-Control = "no-store"

[[headers]]
for = "/*.xml"

  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/robots.txt"

  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/llms.txt"

  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/site.webmanifest"

  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"
  Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/.netlify/functions/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

